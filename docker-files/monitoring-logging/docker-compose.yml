# Monitoring (Grafana + Prometheus + node-exporter + cAdvisor) and centralized
# logging (Graylog + OpenSearch + MongoDB + Filebeat) for the mgps-fenchise-app
# stack in docker-files/application/production.
#
# Nothing here touches that stack's containers or code: metrics are pulled
# over HTTP from the backend's already-exposed actuator endpoint, and logs
# are read from the host log directory it bind-mounts (APP_LOG_DIR) — see the
# `- ${APP_LOG_DIR:-/var/log/mgps}/backend:/app/logs` volume added to that
# compose file's backend/nginx-proxy services.
#
# Start everything:            docker compose up -d
# Start only monitoring:       docker compose up -d grafana prometheus node-exporter cadvisor
# Start only logging:          docker compose up -d graylog mongodb opensearch filebeat
services:
  # ---------------------------------------------------------------------
  # Monitoring: Prometheus scrapes, Grafana visualizes.
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
      - app-net # to reach `backend:8080` for scraping only

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    # cAdvisor is its own Go binary, not the Docker CLI — it doesn't read
    # DOCKER_HOST, it needs its own -docker flag. Points at the socket
    # mounted below (not the default /var/run/docker.sock path, since
    # /var/run is already bind-mounted read-only above).
    command: ["-logtostderr", "-docker=unix:///docker.sock"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Root-mode Docker always uses /var/lib/docker; rootless Docker puts
      # its data root under the user's home instead (check with
      # `docker info | grep "Docker Root Dir"`) — override via .env there.
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}:${DOCKER_ROOT_DIR:-/var/lib/docker}:ro
      - /dev/disk:/dev/disk:ro
      # Without this, cAdvisor's Docker container factory fails to register
      # and it falls back to raw cgroup metrics with no per-container
      # name/image labels — the dashboard's container_memory_usage_bytes
      # panel depends on those. Root-mode Docker's socket is normally at
      # /var/run/docker.sock; rootless Docker's lives under the user's
      # runtime dir instead — find yours with `docker context inspect | grep Host`.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/docker.sock:ro
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards-json:/var/lib/grafana/dashboards-json:ro
    networks:
      - monitoring-net

  # ---------------------------------------------------------------------
  # Logging: Filebeat tails the host log files and ships to Graylog, which
  # stores/indexes them in OpenSearch with metadata in MongoDB.
  # ---------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitoring-net

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      # Required since OpenSearch 2.12 even with the security plugin disabled
      # above — the image's demo-config installer quits without it.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
    ulimits:
      # -1 (unlimited) fails outright under rootless Docker — the container
      # can't be granted a ulimit higher than the host user's own, and that's
      # finite there. 1GiB default comfortably covers the 1g heap above;
      # override via .env if your host's memlock limit is lower, or if
      # you're on a root/non-rootless Docker host and want true -1 back.
      memlock:
        soft: ${OPENSEARCH_MEMLOCK_LIMIT:-1073741824}
        hard: ${OPENSEARCH_MEMLOCK_LIMIT:-1073741824}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - monitoring-net

  graylog:
    image: graylog/graylog:5.2
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?Set GRAYLOG_PASSWORD_SECRET in .env}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?Set GRAYLOG_ROOT_PASSWORD_SHA2 in .env}
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI:-http://localhost:9000/}
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
    ports:
      - "${GRAYLOG_PORT:-9000}:9000" # web UI + REST API
      # 5044 (Beats input) and 12201 (GELF) are reached by Filebeat over the
      # internal network only — not published to the host.
    volumes:
      - graylog-data:/usr/share/graylog/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/lbstatus"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - monitoring-net

  filebeat:
    image: elastic/filebeat:8.15.1
    restart: unless-stopped
    user: root # required for filebeat to read /var/log/mgps and its own data dir
    depends_on:
      - graylog
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${APP_LOG_DIR:-/var/log/mgps}:/var/log/mgps:ro
      - filebeat-data:/usr/share/filebeat/data
    networks:
      - monitoring-net

networks:
  monitoring-net:
    name: mgps-monitoring
  # The app environment being monitored (see APP_NETWORK_NAME in that
  # environment's own .env — default matches application/production's
  # default of mgps-net-prod). Pointing this stack at a different
  # environment's backend is just a matter of changing this one value.
  app-net:
    name: ${APP_NETWORK_NAME:-mgps-net-prod}
    external: true

volumes:
  prometheus-data:
  grafana-data:
  mongo-data:
  opensearch-data:
  graylog-data:
  filebeat-data:
