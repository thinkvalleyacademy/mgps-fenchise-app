global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Spring Boot backend from docker-files/application/production, joined
  # via the external mgps-shared network. Scraping is read-only HTTP GET
  # against the actuator endpoint already exposed in application.yml
  # (management.endpoints.web.exposure.include) — no changes to the app
  # itself, and no impact on it beyond one lightweight request every 15s.
  - job_name: mgps-backend
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: mgps-backend

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
