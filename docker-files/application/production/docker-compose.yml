services:
  backend:
    build:
      context: ${CODE_DIR:-/home/mgps01/mgpsv2/code/mgpsfren/mgps-fenchise-app}
      dockerfile: mgpsfren-backend/Dockerfile
      network: host
    restart: unless-stopped
    networks:
      - app-net
      - db-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-mgps_master}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres123}
      APP_JWT_SECRET_KEY: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://mgpsfren.thinkvalleysoftwares.in,http://100.101.103.63:6080}
    volumes:
      - mgps-uploads:/app/uploads
      # Bind-mounted (not a named volume) so the app's log file is browsable
      # directly on the server filesystem, e.g. for `tail -f` or logrotate,
      # and so the monitoring-logging stack's Filebeat can read it read-only
      # without needing access to this compose project or its containers.
      - ${APP_LOG_DIR:-/var/log/mgps}/backend:/app/logs
    # No host port publish here on purpose: the backend is only reachable via
    # nginx-proxy over the internal app-net network, so nginx's CORS/rate
    # limiting rules can't be bypassed by hitting the backend directly.

  frontend:
    build:
      context: ${CODE_DIR:-/home/mgps01/mgpsv2/code/mgpsfren/mgps-fenchise-app}
      dockerfile: mgpsfren-frontend/Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-net
    expose:
      - "80"

  nginx-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - app-net
    ports:
      - "${PROXY_PORT:-6080}:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_LOG_DIR:-/var/log/mgps}/nginx:/var/log/nginx

networks:
  # Private to this compose project (this environment only) — Compose creates
  # it automatically, no manual `docker network create` needed. Give a second
  # environment (e.g. a `dev` copy of this folder) a different
  # APP_NETWORK_NAME in its own .env and the two environments' identically-
  # named services (backend, frontend, nginx-proxy) never collide.
  app-net:
    name: ${APP_NETWORK_NAME:-mgps-net-prod}

  # Shared infrastructure network Postgres lives on (see ../../postgres).
  # Deliberately the SAME network name across every environment on this
  # server, since they all talk to the one shared Postgres instance,
  # isolated from each other only by DB_NAME. Must already exist — see
  # ../../postgres/docker-compose.yml / README.
  db-net:
    name: ${DB_NETWORK_NAME:-mgps-shared}
    external: true

volumes:
  mgps-uploads:
