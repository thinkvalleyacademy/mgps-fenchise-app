# CORS is handled entirely by the Spring app's allow-list (see CorsConfig /
# app.cors.allowed-origins) so there is exactly one place that decides which
# origins may call the API. Do not add Access-Control-* headers here too.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
  listen 80;
  server_name _;

  # Tighter limit on the credential endpoint specifically, to slow down
  # brute-force/credential-stuffing attempts.
  location = /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;

    proxy_pass http://backend:8080/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;

    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
