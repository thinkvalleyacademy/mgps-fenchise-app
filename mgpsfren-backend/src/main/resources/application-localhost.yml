spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mgps_master
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: create  # Create tables from JPA entities
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

logging:
  level:
    root: INFO
    com.mgps: INFO

app:
  jwt:
    secret-key: local-dev-only-secret-not-for-any-shared-environment
  encryption:
    # Dev-only key so `localhost` boots with zero setup. Never reuse this value
    # anywhere it could be shared or deployed.
    key: VhluCDz9dSgWwDskcR3tJ5gSQmTTgHblq+5qveqm9v4=
